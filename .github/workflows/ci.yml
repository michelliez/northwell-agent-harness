name: CI

on:
  push:
    branches: [main, "sql-validation/generation"]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install dependencies
        # Optional groups are installed so pyright can resolve them. Without a
        # group, its imports are unresolved errors and the module goes silently
        # unchecked -- which is why `bigquery` was already here, and why `ui`
        # joins it now that src/ui imports chainlit and streamlit.
        run: uv sync --group dev --group bigquery --group ui

      - name: Format check
        run: uv run ruff format --check src tests

      - name: Lint
        run: uv run ruff check src tests

      - name: Type check
        run: uv run pyright

      - name: Tests
        run: uv run pytest -q

      # Advisory only: annotates the pull request, never fails the build.
      - name: Documentation layout
        if: always()
        run: uv run python tests/test_documentation_layout.py
