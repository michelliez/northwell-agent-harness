<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trace Viewer</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0f1117; --surface: #1a1d27; --surface2: #242836;
    --border: #2e3348; --text: #e1e4ed; --text2: #8b8fa7;
    --accent: #6c8cff; --green: #4ade80; --red: #f87171;
    --orange: #fb923c; --purple: #a78bfa; --cyan: #22d3ee;
    --yellow: #facc15;
    --stage-prompt: #60a5fa; --stage-policy: #facc15; --stage-intent: #a78bfa;
    --stage-agent: #22d3ee; --stage-final: #4ade80;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace; background: var(--bg); color: var(--text); height: 100vh; overflow: hidden; }
  #app { display: flex; height: 100vh; }

  /* Trace sidebar */
  .trace-sidebar { width: 280px; border-right: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0; }
  .trace-sidebar h2 { padding: 16px; font-size: 14px; color: var(--text2); border-bottom: 1px solid var(--border); }
  .trace-list { overflow-y: auto; flex: 1; }
  .trace-item { padding: 12px 16px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .15s; }
  .trace-item:hover { background: var(--surface2); }
  .trace-item.active { background: var(--surface2); border-left: 3px solid var(--accent); }
  .trace-item .run-id { font-size: 11px; color: var(--text2); font-family: monospace; }
  .trace-item .question { font-size: 13px; margin-top: 4px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trace-item .meta { font-size: 11px; color: var(--text2); margin-top: 4px; display: flex; gap: 8px; align-items: center; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  .status-dot.success { background: var(--green); }
  .status-dot.blocked { background: var(--red); }
  .status-dot.error { background: var(--orange); }
  .status-dot.unknown { background: var(--text2); }

  /* Graph area */
  .graph-area { flex: 1; position: relative; background: var(--bg); display: flex; flex-direction: column; min-width: 0; }
  .graph-container { width: 100%; flex: 1; min-height: 0; }

  /* Detail panel */
  .detail-panel { width: 420px; border-left: 1px solid var(--border); background: var(--surface); overflow-y: auto; flex-shrink: 0; display: none; }
  .detail-panel.open { display: block; }
  .detail-header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: flex-start; }
  .detail-header h3 { font-size: 14px; }
  .detail-close { background: none; border: none; color: var(--text2); cursor: pointer; font-size: 18px; padding: 4px 8px; }
  .detail-close:hover { color: var(--text); }
  .detail-section { border-bottom: 1px solid var(--border); }
  .detail-section-header { padding: 12px 16px; font-size: 12px; color: var(--text2); cursor: pointer; display: flex; justify-content: space-between; align-items: center; user-select: none; }
  .detail-section-header:hover { background: var(--surface2); }
  .detail-section-content { padding: 0 16px 12px; }
  .json-tree { font-family: monospace; font-size: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-all; color: var(--text); }
  .json-key { color: var(--cyan); }
  .json-string { color: var(--green); }
  .json-number { color: var(--orange); }
  .json-bool { color: var(--purple); }
  .json-null { color: var(--text2); }
  .json-bracket { color: var(--text2); }
  .copy-btn { background: var(--surface2); border: 1px solid var(--border); color: var(--text2); font-size: 11px; padding: 2px 8px; border-radius: 4px; cursor: pointer; margin-left: 8px; }
  .copy-btn:hover { color: var(--text); border-color: var(--accent); }

  /* Legend */
  .legend { position: absolute; bottom: 16px; left: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; z-index: 10; font-size: 11px; }
  .legend h4 { color: var(--text2); margin-bottom: 8px; font-size: 11px; }
  .legend-items { display: flex; flex-wrap: wrap; gap: 6px 16px; }
  .legend-item { display: flex; align-items: center; gap: 6px; }
  .legend-swatch { width: 14px; height: 14px; border-radius: 3px; border: 2px solid; display: flex; align-items: center; justify-content: center; font-size: 9px; }

  /* Node styles */
  .flow-node { background: var(--surface); border: 2px solid var(--border); border-radius: 8px; padding: 10px 14px; min-width: 180px; max-width: 260px; font-size: 12px; cursor: pointer; transition: border-color .15s, box-shadow .15s; }
  .flow-node:hover { border-color: var(--accent); box-shadow: 0 0 12px rgba(108,140,255,.2); }
  .flow-node.selected { border-color: var(--accent); box-shadow: 0 0 16px rgba(108,140,255,.3); }
  .flow-node .node-header { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .flow-node .node-icon { font-size: 14px; flex-shrink: 0; }
  .flow-node .node-label { font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .flow-node .node-type-badge { font-size: 10px; padding: 1px 6px; border-radius: 3px; color: var(--bg); font-weight: 600; flex-shrink: 0; }
  .flow-node .node-summary { font-size: 11px; color: var(--text2); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .flow-node .node-meta { font-size: 10px; color: var(--text2); margin-top: 4px; display: flex; gap: 8px; }

  /* Node type colors */
  .ntype-input { border-color: var(--accent); } .ntype-input .node-type-badge { background: var(--accent); }
  .ntype-policy_gate { border-color: var(--yellow); } .ntype-policy_gate .node-type-badge { background: var(--yellow); }
  .ntype-classifier { border-color: var(--purple); } .ntype-classifier .node-type-badge { background: var(--purple); }
  .ntype-generation { border-color: var(--cyan); } .ntype-generation .node-type-badge { background: var(--cyan); }
  .ntype-validation { border-color: var(--orange); } .ntype-validation .node-type-badge { background: var(--orange); }
  .ntype-tool_call { border-color: #60a5fa; } .ntype-tool_call .node-type-badge { background: #60a5fa; }
  .ntype-model_call { border-color: #c084fc; } .ntype-model_call .node-type-badge { background: #c084fc; }
  .ntype-output { border-color: var(--green); } .ntype-output .node-type-badge { background: var(--green); }
  .ntype-error { border-color: var(--red); } .ntype-error .node-type-badge { background: var(--red); }
  .ntype-unknown { border-color: var(--text2); } .ntype-unknown .node-type-badge { background: var(--text2); }

  /* Status markers */
  .status-blocked .node-label { color: var(--red); }
  .status-error .node-label { color: var(--orange); }
  .status-refused .node-label { color: var(--orange); }

  /* Edge labels */
  .edge-label-container { font-size: 10px; background: var(--surface2); padding: 2px 6px; border-radius: 3px; border: 1px solid var(--border); }

  /* Empty state */
  .empty-state { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--text2); font-size: 14px; }

  /* Overview bar */
  .overview-bar { padding: 12px 16px; background: var(--surface2); border-bottom: 1px solid var(--border); font-size: 12px; color: var(--text2); display: flex; gap: 16px; align-items: center; }
  .overview-bar .stat { display: flex; gap: 4px; align-items: center; }
  .overview-bar .stat-value { color: var(--text); font-weight: 600; }
  .stage-bar { padding: 10px 16px; background: rgba(15,17,23,.78); border-bottom: 1px solid var(--border); display: flex; gap: 8px; flex-wrap: wrap; }
  .stage-pill { border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 4px 10px; font-size: 11px; color: var(--text2); }
  .stage-pill.prompt { border-color: var(--stage-prompt); color: var(--stage-prompt); }
  .stage-pill.policy { border-color: var(--stage-policy); color: var(--stage-policy); }
  .stage-pill.intent { border-color: var(--stage-intent); color: var(--stage-intent); }
  .stage-pill.agent { border-color: var(--stage-agent); color: var(--stage-agent); }
  .stage-pill.final { border-color: var(--stage-final); color: var(--stage-final); }
  .stage-label { margin-bottom: 6px; font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--text2); }
  .stage-prompt { box-shadow: inset 4px 0 0 var(--stage-prompt); }
  .stage-policy { box-shadow: inset 4px 0 0 var(--stage-policy); }
  .stage-intent { box-shadow: inset 4px 0 0 var(--stage-intent); }
  .stage-agent { box-shadow: inset 4px 0 0 var(--stage-agent); }
  .stage-final { box-shadow: inset 4px 0 0 var(--stage-final); }
  .static-stage-heading { width: 320px; margin-top: 12px; padding: 6px 0; color: var(--text2); font-size: 11px; text-transform: uppercase; letter-spacing: .08em; border-bottom: 1px solid var(--border); }
</style>
</head>

<script type="module">
import React from 'react';
import { createRoot } from 'react-dom/client';
import { jsx, jsxs, Fragment } from 'react/jsx-runtime';
import { ReactFlow, Background, Controls, Handle, Position, MarkerType } from '@xyflow/react';
import dagre from 'dagre';

const h = jsx;
const hs = jsxs;

const NODE_TYPE_INFO = {
  input:       { icon: '▶', label: 'Input' },
  policy_gate: { icon: '⚠', label: 'Policy' },
  classifier:  { icon: '⚙', label: 'Classifier' },
  generation:  { icon: '✎', label: 'Generation' },
  validation:  { icon: '✓', label: 'Validation' },
  tool_call:   { icon: '⚒', label: 'Tool' },
  model_call:  { icon: '⬣', label: 'Model' },
  output:      { icon: '✔', label: 'Output' },
  error:       { icon: '✖', label: 'Error' },
  unknown:     { icon: '?',  label: 'Unknown' },
};

function formatDuration(d) {
  if (d == null) return '';
  if (d < 0.001) return '<1ms';
  if (d < 1) return (d * 1000).toFixed(0) + 'ms';
  return d.toFixed(2) + 's';
}

function escapeHtml(s) {
  if (typeof s !== 'string') return String(s);
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function JsonView({ data, depth = 0 }) {
  if (data === null || data === undefined) return h('span', { className: 'json-null' }, 'null');
  if (typeof data === 'boolean') return h('span', { className: 'json-bool' }, String(data));
  if (typeof data === 'number') return h('span', { className: 'json-number' }, String(data));
  if (typeof data === 'string') {
    if (data === '[REDACTED]') return h('span', { className: 'json-string', style: { color: 'var(--red)' } }, '"[REDACTED]"');
    const display = data.length > 300 ? data.slice(0, 300) + '...' : data;
    return h('span', { className: 'json-string' }, '"' + escapeHtml(display) + '"');
  }
  if (Array.isArray(data)) {
    if (data.length === 0) return h('span', { className: 'json-bracket' }, '[]');
    const [open, setOpen] = React.useState(depth < 2);
    if (!open) {
      return h('span', { className: 'json-bracket', onClick: () => setOpen(true), style: { cursor: 'pointer' } },
        `[...${data.length} items]`);
    }
    return hs('span', {}, [
      h('span', { className: 'json-bracket', onClick: () => setOpen(false), style: { cursor: 'pointer' }, key: 'open' }, '['),
      ...data.map((item, i) =>
        hs('div', { key: i, style: { paddingLeft: 16 } }, [
          h(JsonView, { data: item, depth: depth + 1 }),
          i < data.length - 1 ? ',' : ''
        ])
      ),
      h('span', { className: 'json-bracket', key: 'close' }, ']')
    ]);
  }
  if (typeof data === 'object') {
    const keys = Object.keys(data);
    if (keys.length === 0) return h('span', { className: 'json-bracket' }, '{}');
    const [open, setOpen] = React.useState(depth < 2);
    if (!open) {
      return h('span', { className: 'json-bracket', onClick: () => setOpen(true), style: { cursor: 'pointer' } },
        `{...${keys.length} keys}`);
    }
    return hs('span', {}, [
      h('span', { className: 'json-bracket', onClick: () => setOpen(false), style: { cursor: 'pointer' }, key: 'open' }, '{'),
      ...keys.map((key, i) =>
        hs('div', { key, style: { paddingLeft: 16 } }, [
          h('span', { className: 'json-key' }, '"' + escapeHtml(key) + '"'),
          ': ',
          h(JsonView, { data: data[key], depth: depth + 1 }),
          i < keys.length - 1 ? ',' : ''
        ])
      ),
      h('span', { className: 'json-bracket', key: 'close' }, '}')
    ]);
  }
  return h('span', {}, String(data));
}

function DetailSection({ title, children, defaultOpen = false }) {
  const [open, setOpen] = React.useState(defaultOpen);
  return hs('div', { className: 'detail-section' }, [
    hs('div', { className: 'detail-section-header', onClick: () => setOpen(!open), key: 'header' }, [
      h('span', {}, title),
      h('span', {}, open ? '▼' : '▶')
    ]),
    open ? h('div', { className: 'detail-section-content', key: 'content' }, children) : null
  ]);
}

function CopyButton({ text }) {
  const [copied, setCopied] = React.useState(false);
  return h('button', {
    className: 'copy-btn',
    onClick: (e) => {
      e.stopPropagation();
      navigator.clipboard.writeText(typeof text === 'string' ? text : JSON.stringify(text, null, 2));
      setCopied(true);
      setTimeout(() => setCopied(false), 1500);
    }
  }, copied ? 'Copied!' : 'Copy');
}

function DetailPanel({ event, onClose }) {
  if (!event) return null;
  const info = NODE_TYPE_INFO[event.node_type] || NODE_TYPE_INFO.unknown;
  return hs('div', { className: 'detail-panel open' }, [
    hs('div', { className: 'detail-header', key: 'header' }, [
      hs('div', {}, [
        h('h3', {}, event.label),
        h('div', { style: { fontSize: 11, color: 'var(--text2)', marginTop: 4 } }, info.icon + ' ' + info.label + ' • ' + event.status)
      ]),
      h('button', { className: 'detail-close', onClick: onClose }, '×')
    ]),
    h(DetailSection, { title: 'Overview', defaultOpen: true, key: 'overview' },
      hs('div', { className: 'json-tree' }, [
        h('div', { key: 'type' }, hs(Fragment, {}, [h('span', { className: 'json-key' }, 'Event: '), event.event_type])),
        h('div', { key: 'status' }, hs(Fragment, {}, [h('span', { className: 'json-key' }, 'Status: '), event.status])),
        event.duration != null ? h('div', { key: 'dur' }, hs(Fragment, {}, [h('span', { className: 'json-key' }, 'Duration: '), formatDuration(event.duration)])) : null,
        event.round_number != null ? h('div', { key: 'round' }, hs(Fragment, {}, [h('span', { className: 'json-key' }, 'Round: '), String(event.round_number)])) : null,
        event.tool_name ? h('div', { key: 'tool' }, hs(Fragment, {}, [h('span', { className: 'json-key' }, 'Tool: '), event.tool_name])) : null,
        event.model_name ? h('div', { key: 'model' }, hs(Fragment, {}, [h('span', { className: 'json-key' }, 'Model: '), event.model_name])) : null,
        event.error ? h('div', { key: 'err', style: { color: 'var(--red)' } }, hs(Fragment, {}, [h('span', { className: 'json-key' }, 'Error: '), event.error])) : null,
      ])
    ),
    Object.keys(event.input_data || {}).length > 0
      ? h(DetailSection, { title: 'Input', key: 'input' },
          hs('div', { className: 'json-tree' }, [h(JsonView, { data: event.input_data }), h(CopyButton, { text: event.input_data, key: 'copy' })]))
      : null,
    Object.keys(event.output_data || {}).length > 0
      ? h(DetailSection, { title: 'Output', defaultOpen: true, key: 'output' },
          hs('div', { className: 'json-tree' }, [h(JsonView, { data: event.output_data }), h(CopyButton, { text: event.output_data, key: 'copy' })]))
      : null,
    event.summary
      ? h(DetailSection, { title: 'Summary', key: 'summary' },
          h('div', { style: { fontSize: 12, lineHeight: 1.6 } }, event.summary))
      : null,
    h(DetailSection, { title: 'Raw Trace Record', key: 'raw' },
      hs('div', { className: 'json-tree' }, [h(JsonView, { data: event.raw }), h(CopyButton, { text: event.raw, key: 'copy' })]))
  ]);
}

function TraceNode({ data }) {
  const info = NODE_TYPE_INFO[data.node_type] || NODE_TYPE_INFO.unknown;
  const stage = data.stage || getStage(data);
  const classes = ['flow-node', `ntype-${data.node_type}`, `stage-${stage.key}`];
  if (data.status === 'blocked' || data.status === 'error' || data.status === 'refused') {
    classes.push(`status-${data.status}`);
  }
  if (data.selected) classes.push('selected');

  return hs('div', { className: classes.join(' '), onClick: () => data.onSelect(data.event_idx) }, [
    h(Handle, { type: 'target', position: Position.Top, style: { visibility: 'hidden' }, key: 'target' }),
    h('div', { className: 'stage-label', key: 'stage' }, stage.label),
    hs('div', { className: 'node-header', key: 'header' }, [
      h('span', { className: 'node-icon', key: 'icon', 'aria-label': info.label }, info.icon),
      h('span', { className: 'node-label', key: 'label', title: data.label }, data.label),
      h('span', { className: 'node-type-badge', key: 'badge' }, info.label),
    ]),
    data.summary ? h('div', { className: 'node-summary', key: 'summary', title: data.summary }, data.summary) : null,
    hs('div', { className: 'node-meta', key: 'meta' }, [
      data.duration != null ? h('span', { key: 'dur' }, '⏱ ' + formatDuration(data.duration)) : null,
      data.round_number != null ? h('span', { key: 'round' }, 'R' + data.round_number) : null,
    ]),
    h(Handle, { type: 'source', position: Position.Bottom, style: { visibility: 'hidden' }, key: 'source' }),
  ]);
}

const nodeTypes = { traceNode: TraceNode };

function getStage(node) {
  const eventType = node.event_type || '';
  const nodeType = node.node_type || '';
  if (nodeType === 'input') return { key: 'prompt', label: 'Prompt' };
  if (nodeType === 'policy_gate') return { key: 'policy', label: 'Policy Gate' };
  if (nodeType === 'classifier' || eventType.startsWith('intent.')) return { key: 'intent', label: 'Intent Classifier' };
  if (nodeType === 'output') return { key: 'final', label: 'Final Answer' };
  return { key: 'agent', label: 'Agent Loop' };
}

function layoutGraph(nodes, edges) {
  const g = new dagre.graphlib.Graph();
  g.setGraph({ rankdir: 'LR', ranksep: 90, nodesep: 46 });
  g.setDefaultEdgeLabel(() => ({}));
  nodes.forEach(n => g.setNode(n.id, { width: 260, height: 96 }));
  edges.forEach(e => g.setEdge(e.source, e.target));
  dagre.layout(g);
  return nodes.map(n => {
    const pos = g.node(n.id);
    return { ...n, position: { x: pos.x - 130, y: pos.y - 48 } };
  });
}

function App() {
  const traces = typeof TRACE_DATA !== 'undefined' ? TRACE_DATA : [];
  const [selectedTrace, setSelectedTrace] = React.useState(traces.length > 0 ? 0 : null);
  const [selectedEvent, setSelectedEvent] = React.useState(null);

  const trace = selectedTrace != null ? traces[selectedTrace] : null;

  const { flowNodes, flowEdges } = React.useMemo(() => {
    if (!trace) return { flowNodes: [], flowEdges: [] };

    const rawNodes = trace.nodes.map(n => ({
      id: n.id,
      type: 'traceNode',
      data: { ...n, stage: getStage(n), onSelect: (idx) => setSelectedEvent(idx), selected: false },
      position: { x: 0, y: 0 },
    }));

    const positioned = layoutGraph(rawNodes, trace.edges);

    const fe = trace.edges.map((e, i) => ({
      id: `e${i}`,
      source: e.source,
      target: e.target,
      label: e.label || undefined,
      type: 'smoothstep',
      animated: e.edge_type === 'blocked' || e.edge_type === 'error',
      style: {
        stroke: e.edge_type === 'blocked' ? 'var(--red)' :
                e.edge_type === 'error' ? 'var(--orange)' : 'var(--border)',
        strokeWidth: 2,
      },
      labelStyle: { fontSize: 10, fill: 'var(--text2)' },
      labelBgStyle: { fill: 'var(--surface2)', stroke: 'var(--border)' },
      labelBgPadding: [4, 6],
      labelBgBorderRadius: 3,
      markerEnd: { type: MarkerType.ArrowClosed, color: e.edge_type === 'blocked' ? 'var(--red)' : 'var(--border)' },
    }));

    return { flowNodes: positioned.map(n => ({
      ...n,
      data: { ...n.data, selected: selectedEvent === n.data.event_idx }
    })), flowEdges: fe };
  }, [trace, selectedEvent]);

  const eventDetail = trace && selectedEvent != null ? trace.events[selectedEvent] : null;

  return hs('div', { id: 'app' }, [
    hs('div', { className: 'trace-sidebar', key: 'sidebar' }, [
      h('h2', { key: 'title' }, `Traces (${traces.length})`),
      h('div', { className: 'trace-list', key: 'list' },
        traces.map((t, i) =>
          hs('div', {
            key: t.run_id,
            className: 'trace-item' + (i === selectedTrace ? ' active' : ''),
            onClick: () => { setSelectedTrace(i); setSelectedEvent(null); }
          }, [
            h('div', { className: 'run-id', key: 'id' }, t.run_id.slice(0, 12) + '...'),
            h('div', { className: 'question', key: 'q' }, t.question || '(hidden)'),
            hs('div', { className: 'meta', key: 'meta' }, [
              h('span', { className: `status-dot ${t.status}`, key: 'dot' }),
              h('span', { key: 'status' }, t.status),
              h('span', { key: 'events' }, t.events.length + ' events'),
              t.total_duration != null ? h('span', { key: 'dur' }, formatDuration(t.total_duration)) : null,
            ])
          ])
        )
      )
    ]),
    hs('div', { className: 'graph-area', key: 'graph' }, [
      trace ? hs(Fragment, {}, [
        hs('div', { className: 'overview-bar', key: 'bar' }, [
          hs('span', { className: 'stat', key: 'id' }, [h('span', {}, 'Run: '), h('span', { className: 'stat-value' }, trace.run_id.slice(0, 16))]),
          hs('span', { className: 'stat', key: 'status' }, [h('span', { className: `status-dot ${trace.status}` }), h('span', { className: 'stat-value' }, ' ' + trace.status)]),
          hs('span', { className: 'stat', key: 'events' }, [h('span', {}, 'Events: '), h('span', { className: 'stat-value' }, String(trace.events.length))]),
          trace.total_duration != null ? hs('span', { className: 'stat', key: 'dur' }, [h('span', {}, 'Duration: '), h('span', { className: 'stat-value' }, formatDuration(trace.total_duration))]) : null,
        ]),
        h('div', { className: 'stage-bar', key: 'stages' }, [
          h('span', { className: 'stage-pill prompt', key: 'prompt' }, '1 Prompt'),
          h('span', { className: 'stage-pill policy', key: 'policy' }, '2 Policy Gate'),
          h('span', { className: 'stage-pill intent', key: 'intent' }, '3 Intent Classifier'),
          h('span', { className: 'stage-pill agent', key: 'agent' }, '4 Agent Loop'),
          h('span', { className: 'stage-pill final', key: 'final' }, '5 Final Answer'),
        ]),
        h('div', { className: 'graph-container', key: 'flow' },
          h(ReactFlow, {
            nodes: flowNodes,
            edges: flowEdges,
            nodeTypes,
            fitView: true,
            minZoom: 0.3,
            maxZoom: 2,
            proOptions: { hideAttribution: true },
          }, [
            h(Background, { color: 'var(--border)', gap: 20, key: 'bg' }),
            h(Controls, { key: 'controls', showInteractive: false }),
          ])
        ),
        h('div', { className: 'legend', key: 'legend' },
          hs(Fragment, {}, [
            h('h4', { key: 'title' }, 'Node Types'),
            h('div', { className: 'legend-items', key: 'items' },
              Object.entries(NODE_TYPE_INFO).map(([type, info]) =>
                hs('div', { className: 'legend-item', key: type }, [
                  h('span', { className: `legend-swatch ntype-${type}`, style: { borderColor: 'currentColor' } }, info.icon),
                  h('span', {}, info.label),
                ])
              )
            )
          ])
        ),
      ]) : h('div', { className: 'empty-state' }, 'Select a trace from the sidebar'),
    ]),
    h(DetailPanel, { event: eventDetail, onClose: () => setSelectedEvent(null), key: 'detail' }),
  ]);
}

createRoot(document.getElementById('app')).render(h(App));
</script>
<script>
window.addEventListener('error', (event) => {
  window.__TRACE_VIEWER_ERROR__ = event.message || 'Unknown render error';
});
window.addEventListener('unhandledrejection', (event) => {
  window.__TRACE_VIEWER_ERROR__ = String(event.reason || 'Unknown render error');
});

const STATIC_NODE_TYPE_INFO = {
  input: { icon: '▶', label: 'Input' },
  policy_gate: { icon: '⚠', label: 'Policy' },
  classifier: { icon: '⚙', label: 'Classifier' },
  generation: { icon: '✎', label: 'Generation' },
  validation: { icon: '✓', label: 'Validation' },
  tool_call: { icon: '⚒', label: 'Tool' },
  model_call: { icon: '⬣', label: 'Model' },
  output: { icon: '✔', label: 'Output' },
  error: { icon: '✖', label: 'Error' },
  unknown: { icon: '?', label: 'Unknown' },
};

function staticEscapeHtml(value) {
  return String(value ?? '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function renderStaticTraceViewer() {
  const root = document.getElementById('app');
  if (!root || root.children.length > 0) return;
  const traces = typeof TRACE_DATA !== 'undefined' ? TRACE_DATA : [];
  root.style.display = 'flex';
  root.innerHTML = '';

  const sidebar = document.createElement('div');
  sidebar.className = 'trace-sidebar';
  sidebar.innerHTML = `<h2>Traces (${traces.length})</h2><div class="trace-list"></div>`;

  const graph = document.createElement('div');
  graph.className = 'graph-area';
  graph.style.overflow = 'auto';

  const list = sidebar.querySelector('.trace-list');

  function drawTrace(index) {
    const trace = traces[index];
    [...list.children].forEach((child, i) => child.classList.toggle('active', i === index));
    if (!trace) {
      graph.innerHTML = '<div class="empty-state">No trace data found.</div>';
      return;
    }

    const warning = window.__TRACE_VIEWER_ERROR__
      ? `<div style="padding:10px 16px;color:var(--orange);border-bottom:1px solid var(--border);font-size:12px">Interactive graph failed to load, showing static fallback: ${staticEscapeHtml(window.__TRACE_VIEWER_ERROR__)}</div>`
      : '';

    graph.innerHTML = `
      <div class="overview-bar">
        <span class="stat">Run: <span class="stat-value">${staticEscapeHtml(trace.run_id.slice(0, 16))}</span></span>
        <span class="stat"><span class="status-dot ${trace.status}"></span><span class="stat-value"> ${staticEscapeHtml(trace.status)}</span></span>
        <span class="stat">Events: <span class="stat-value">${trace.events.length}</span></span>
      </div>
      ${warning}
      <div style="padding:28px;display:flex;flex-direction:column;align-items:center;gap:12px"></div>
    `;

    const lane = graph.lastElementChild;
    let currentStage = '';
    trace.nodes.forEach((node, i) => {
      const stage = getStaticStage(node);
      if (stage.key !== currentStage) {
        currentStage = stage.key;
        const heading = document.createElement('div');
        heading.className = 'static-stage-heading';
        heading.textContent = stage.label;
        lane.appendChild(heading);
      }
      const type = STATIC_NODE_TYPE_INFO[node.node_type] || STATIC_NODE_TYPE_INFO.unknown;
      const card = document.createElement('div');
      card.className = `flow-node ntype-${node.node_type} stage-${stage.key} status-${node.status}`;
      card.style.width = '320px';
      card.innerHTML = `
        <div class="node-header">
          <span class="node-icon">${type.icon}</span>
          <span class="node-label" title="${staticEscapeHtml(node.label)}">${staticEscapeHtml(node.label)}</span>
          <span class="node-type-badge">${staticEscapeHtml(type.label)}</span>
        </div>
        ${node.summary ? `<div class="node-summary" title="${staticEscapeHtml(node.summary)}">${staticEscapeHtml(node.summary)}</div>` : ''}
      `;
      card.onclick = () => {
        const event = trace.events[node.event_idx];
        alert(JSON.stringify(event.raw || event, null, 2));
      };
      lane.appendChild(card);

      const edge = trace.edges[i];
      if (edge) {
        const arrow = document.createElement('div');
        arrow.style.color = edge.edge_type === 'blocked' ? 'var(--red)' : 'var(--text2)';
        arrow.style.fontSize = '12px';
        arrow.textContent = edge.label ? `↓ ${edge.label}` : '↓';
        lane.appendChild(arrow);
      }
    });
  }

  traces.forEach((trace, i) => {
    const item = document.createElement('div');
    item.className = 'trace-item' + (i === 0 ? ' active' : '');
    item.innerHTML = `
      <div class="run-id">${staticEscapeHtml(trace.run_id.slice(0, 12))}...</div>
      <div class="question">${staticEscapeHtml(trace.question || '(hidden)')}</div>
      <div class="meta"><span class="status-dot ${trace.status}"></span><span>${staticEscapeHtml(trace.status)}</span><span>${trace.events.length} events</span></div>
    `;
    item.onclick = () => drawTrace(i);
    list.appendChild(item);
  });

  root.appendChild(sidebar);
  root.appendChild(graph);
  drawTrace(0);
}

function getStaticStage(node) {
  const eventType = node.event_type || '';
  const nodeType = node.node_type || '';
  if (nodeType === 'input') return { key: 'prompt', label: 'Prompt' };
  if (nodeType === 'policy_gate') return { key: 'policy', label: 'Policy Gate' };
  if (nodeType === 'classifier' || eventType.startsWith('intent.')) return { key: 'intent', label: 'Intent Classifier' };
  if (nodeType === 'output') return { key: 'final', label: 'Final Answer' };
  return { key: 'agent', label: 'Agent Loop' };
}

setTimeout(renderStaticTraceViewer, 1500);
</script>
</body>
</html>
