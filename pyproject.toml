[project]
name = "agent-harness"
version = "0.1.0"
description = "Policy-gated agent workflows with retrieval, SQL planning, and evaluation"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.116.0",
    "beautifulsoup4>=4.15.0",
    "fastmcp>=3.4.3",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "sqlglot>=30.12.0,<30.13.0",
]

[project.scripts]
agent-harness = "agent_host.cli:main"
agent-harness-data-catalog = "mcp_servers.data_catalog:main"
agent-harness-intent = "mcp_servers.intent:main"
agent-harness-sql-generation = "mcp_servers.sql_generation:main"
agent-harness-sql-validation = "mcp_servers.sql_validation:main"
agent-harness-eval = "evals.runner:main"
agent-harness-traces = "trace_viewer.__main__:main"
agent-harness-rag = "retrieval.mcp_server:main"
agent-harness-rag-index = "retrieval.indexer:main"
agent-harness-rag-audit = "retrieval.audit:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/agent_host",
    "src/evals",
    "src/mcp_servers",
    "src/policy",
    "src/retrieval",
    "src/trace_viewer",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.9.0",
    "pyright>=1.1.400",
]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
include = ["src"]
typeCheckingMode = "basic"
reportPrivateImportUsage = "none"
