[project]
name = "agent-harness"
version = "0.1.0"
description = "Policy-gated agent workflows with retrieval, SQL planning, and evaluation"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.116.0",
    "beautifulsoup4>=4.15.0",
    "langgraph>=1.2.9,<2",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "sqlglot>=30.12.0,<30.13.0",
]

[project.scripts]
agent-harness = "agent_host.cli:main"
agent-harness-eval = "evals.runner:main"
agent-harness-traces = "trace_viewer.__main__:main"
agent-harness-rag-index = "retrieval.indexer:main"
agent-harness-rag-audit = "retrieval.audit:main"
agent-harness-genq-parse = "retrieval.genq.corpus_parser:main"
agent-harness-genq-split = "retrieval.genq.dataset_split:main"
agent-harness-genq-generate = "retrieval.genq.query_generation:main"
agent-harness-genq-filter = "retrieval.genq.query_filter:main"
agent-harness-genq-baseline = "retrieval.genq.baseline_faiss:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/agent_host",
    "src/evals",
    "src/policy",
    "src/retrieval",
    "src/sql",
    "src/trace_viewer",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.9.0",
    "pyright>=1.1.400",
]
genq = [
    "datasets>=5.0.0",
    "faiss-cpu>=1.14.3",
    "protobuf>=6.33.5",
    "sentence-transformers>=5.6.1",
    "sentencepiece>=0.2.2",
    "torch>=2.13.0",
    "tqdm>=4.69.1",
    "transformers>=4.41.0,<5",
]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
include = ["src"]
typeCheckingMode = "basic"
reportPrivateImportUsage = "none"
