[project]
name = "agent-harness"
version = "0.1.0"
description = "Policy-gated agent workflows with retrieval, SQL planning, and evaluation"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.116.0",
    "beautifulsoup4>=4.15.0",
    "langgraph>=1.2.9,<2",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "sqlglot>=30.12.0,<30.13.0",
]

[project.scripts]
agent-harness = "agent_host.cli:main"
agent-harness-eval = "evals.runner:main"
agent-harness-traces = "trace_viewer.__main__:main"
agent-harness-rag-index = "retrieval.indexer:main"
agent-harness-rag-audit = "retrieval.audit:main"
agent-harness-genq-parse = "retrieval.column_parser:main"
agent-harness-genq-split = "evals.dataset_split:main"
agent-harness-genq-generate = "retrieval.genq.query_generation:main"
agent-harness-genq-filter = "evals.query_filter:main"
agent-harness-genq-metadata-convert = "retrieval.genq.metadata_to_chunks:main"
agent-harness-genq-baseline = "retrieval.genq.baseline_faiss:main"
agent-harness-genq-train = "retrieval.genq.train_biencoder:main"
agent-harness-metadata-extract = "retrieval.metadata_extractor:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/agent_host",
    "src/evals",
    "src/policy",
    "src/retrieval",
    "src/sql",
    "src/trace_viewer",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.0",
    "ruff>=0.9.0",
    "pyright>=1.1.400",
]
# BigQuery stays optional while execution is disabled: no graph node imports the
# SDK, and `pyarrow` alone is a ~100 MB install. `sql/bigquery_adapter.dry_run`
# imports it lazily and fails closed when the group is absent.
bigquery = [
    "google-cloud-bigquery>=3.26.0",
    "pyarrow>=16.0.0",
]
# Baseline inference and bi-encoder fine-tuning. Query generation runs through
# the Anthropic SDK (a core dependency) and needs nothing from this group.
genq = [
    "accelerate>=0.26.0",
    "datasets>=5.0.0",
    "faiss-cpu>=1.14.3",
    "numpy>=2.1.0",
    "sentence-transformers>=4.1.0",
    "torch>=2.13.0",
    "transformers>=4.41.0,<5",
]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
include = ["src"]
typeCheckingMode = "basic"
reportPrivateImportUsage = "none"
