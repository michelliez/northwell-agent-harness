[project]
name = "agent-harness"
version = "0.1.0"
description = "Policy-gated Clarity agent with retrieval, SQL planning, API, and UI"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.116.0",
    "beautifulsoup4>=4.15.0",
    "certifi>=2025.0.0",
    "fastapi>=0.115.0",
    "langgraph>=1.2.9,<2",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "sqlglot>=30.12.0,<30.13.0",
    "uvicorn[standard]>=0.30.0",
]

[project.scripts]
agent-harness = "agent_host.cli:main"
agent-harness-traces = "trace_viewer.__main__:main"
agent-harness-rag-index = "retrieval.indexer:main"
agent-harness-rag-audit = "retrieval.audit:main"
agent-harness-genq-parse = "retrieval.column_parser:main"
agent-harness-metadata-extract = "retrieval.metadata_extractor:main"
agent-harness-ui = "ui.chainlit_runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "src/agent_host",
    "src/api",
    "src/policy",
    "src/retrieval",
    "src/sql",
    "src/trace_viewer",
    "src/ui",
]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.uv]
package = true

# cryptography arrives only transitively -- through google-auth for BigQuery and
# through pyjwt[crypto] for chainlit -- so neither a direct pin nor a group bump
# can raise it. Versions 44.0.0 through 49.x expose a Bleichenbacher oracle in
# PKCS#7 EnvelopedData decryption (CVE-2026-69247): the result of the RSA
# operation was distinguishable both by error and by timing, which is enough to
# recover a content-encryption key without ever holding the private key.
#
# Nothing here decrypts PKCS#7, so the path is unreachable today. The floor
# exists so that remains true by construction rather than because no one has
# added the feature yet.
constraint-dependencies = ["cryptography>=50.0.0"]

# PyPI ships CPU-only torch wheels for Windows, so an RTX card sits idle behind
# `torch.cuda.is_available() == False`. CUDA builds live on PyTorch's own index.
# The marker keeps macOS on PyPI, where the default wheel is the one with MPS.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu126", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.0",
    "ruff>=0.9.0",
    "pyright>=1.1.400",
]
# BigQuery stays optional while execution is disabled: no graph node imports the
# SDK, and `pyarrow` alone is a ~100 MB install. `sql/bigquery_adapter.dry_run`
# imports it lazily and fails closed when the group is absent.
bigquery = [
    "google-cloud-bigquery>=3.26.0",
    "pyarrow>=16.0.0",
]
ui = [
    "chainlit>=2.9.4",
    "httpx>=0.28.1",
    "streamlit>=1.59.1",
]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
include = ["src"]
typeCheckingMode = "basic"
reportPrivateImportUsage = "none"
