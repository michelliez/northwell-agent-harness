[project]
name = "nw-harness"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.116.0",
    "beautifulsoup4>=4.15.0",
    "fastmcp>=3.4.3",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "rich>=15.0.0",
    "sqlglot>=30.12.0,<30.13.0",
]

[project.scripts]
nh-spike-agent = "harness_spike.agent_host.cli:main"
nh-spike-data-catalog = "harness_spike.mcp_servers.data_catalog:main"
nh-spike-intent = "harness_spike.mcp_servers.intent:main"
nh-spike-sql-generation = "harness_spike.mcp_servers.sql_generation:main"
nh-spike-sql-validation = "harness_spike.mcp_servers.sql_validation:main"
nh-spike-eval = "harness_spike.evals.runner:main"
nh-spike-traces = "harness_spike.trace_viewer.__main__:main"
nh-spike-rag = "harness_spike.mcp_servers.rag_retrieval:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness_spike"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.uv]
package = true

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.9.0",
    "pyright>=1.1.400",
]

[tool.ruff]
src = ["src"]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pyright]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"
include = ["src"]
typeCheckingMode = "basic"
reportPrivateImportUsage = "none"
